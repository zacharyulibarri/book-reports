<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Past Ithaca Events | bookreports.club</title>
  <meta name="description" content="Archive of past Book Reports meetups in Ithaca, NY.">
  <style>

    @import url(//db.onlinewebfonts.com/c/91db3f2094638a07f654364bee66a81e?family=TeXGyreHeros);

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'TeXGyreHeros', Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      padding: 16px;
    }

    @media (min-width: 700px)  { body { padding: 24px 5%; } }
    @media (min-width: 1100px) { body { padding: 32px 12%; } }

    a:link, a:visited { color: #00ffff; }
    a:hover { color: #fff; }

    .site-header {
      border-bottom: 1px solid #333;
      padding-bottom: 14px;
      margin-bottom: 24px;
    }

    .site-title {
      font-size: clamp(1.8rem, 6vw, 3rem);
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 6px #000;
      letter-spacing: 0.02em;
    }

    .site-tagline {
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      color: #aaa;
      font-style: italic;
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    .site-city {
      font-size: clamp(0.8rem, 2vw, 1rem);
      color: #00ffff;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    nav {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    nav a {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: #00ffff;
      border: 1px solid #00ffff44;
      padding: 4px 12px;
      border-radius: 2px;
      transition: background 0.15s, color 0.15s;
    }

    nav a:hover, nav a.active {
      background: #00ffff;
      color: #000;
    }

    h2 {
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      color: #fff;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      margin: 36px 0 16px;
      letter-spacing: 0.04em;
    }

    h3 {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: #fff;
      font-weight: bold;
      letter-spacing: 0.03em;
    }

    .loading-state {
      color: #333;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 32px 0;
    }

    .event-block { margin-bottom: 40px; }

    .event-card {
      border: 1px solid #222;
      border-left: 4px solid #333;
      background: #080808;
      padding: 20px 24px;
      margin-bottom: 16px;
      border-radius: 2px;
    }

    .event-date {
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
    }

    .event-meta {
      margin-top: 10px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      font-size: 1rem;
    }

    .event-meta .label {
      color: #444;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      padding-top: 2px;
    }

    .event-meta .value { color: #666; }
    .event-meta .value a { color: #446666; }

    .event-notes {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #444;
      font-style: italic;
    }

    .rsvp-section { margin-bottom: 8px; }

    .rsvp-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .attendee-count {
      display: inline-block;
      background: #0a0a0a;
      border: 1px solid #222;
      color: #446666;
      border-radius: 2px;
      padding: 3px 16px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }

    thead th {
      text-align: left;
      color: #444;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-bottom: 1px solid #1a1a1a;
      padding: 6px 10px;
    }

    tbody tr { border-bottom: 1px solid #111; }
    tbody td { padding: 8px 10px; vertical-align: middle; }

    .td-num   { color: #333; font-size: 0.85rem; width: 32px; }
    .td-name  { color: #666; font-weight: bold; }
    .td-name.anon { color: #444; font-style: italic; }
    .td-guests { color: #444; font-size: 0.9rem; }

    .no-rsvps { color: #333; font-size: 0.85rem; font-style: italic; padding: 8px 0; }

    .empty-state {
      border: 1px solid #1e1e1e;
      border-left: 4px solid #333;
      background: #060606;
      padding: 40px 32px;
      border-radius: 2px;
      margin-top: 8px;
      max-width: 560px;
    }

    .empty-state-icon { font-size: 2rem; margin-bottom: 16px; opacity: 0.4; }

    .empty-state-heading {
      font-size: clamp(1.1rem, 2.8vw, 1.35rem);
      font-weight: bold;
      color: #fff;
      margin-bottom: 10px;
    }

    .empty-state-body { font-size: 0.95rem; color: #555; line-height: 1.7; }

    footer {
      border-top: 1px solid #1a1a1a;
      margin-top: 48px;
      padding-top: 16px;
      font-size: 0.8rem;
      color: #444;
      text-align: center;
    }

    footer a { color: #444; }
    footer a:hover { color: #00ffff; }

  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-title">bookreports.club</div>
    <div class="site-tagline">The Bookless Book Club</div>
    <div class="site-city">Ithaca, NY</div>
    <nav>
      <a href="/">← All Cities</a>
      <a href="/boulder">Boulder</a>
      <a href="/ithaca">Ithaca</a>
      <a href="/about">About</a>
    </nav>
  </header>

  <h2>Past Events in Ithaca</h2>

  <div id="events-container">
    <p class="loading-state">Loading past events&hellip;</p>
  </div>

  <footer>
    <a href="/">bookreports.club</a> &nbsp;&middot;&nbsp;
    <a href="/boulder">Boulder</a> &nbsp;&middot;&nbsp;
    <a href="/ithaca">Ithaca</a>
  </footer>

  <script>

    const CONFIG = {
      EVENTS_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRW5CoSWeusKtpyawd40kmRn62gp0Agx8ZMwLf6-f2asG4gx_5m5Yllw_t2Y2lICn2AHqBPPMCZsiim/pub?gid=0&single=true&output=csv',
      RSVPS_CSV_URL:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vRW5CoSWeusKtpyawd40kmRn62gp0Agx8ZMwLf6-f2asG4gx_5m5Yllw_t2Y2lICn2AHqBPPMCZsiim/pub?gid=1121960514&single=true&output=csv',
    };

    function parseCSVRow(row) {
      const cells = [];
      let cur = '', inQ = false;
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch === '"') {
          if (inQ && row[i+1] === '"') { cur += '"'; i++; }
          else { inQ = !inQ; }
        } else if (ch === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      cells.push(cur.trim());
      return cells;
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n').filter(l => l.trim());
      if (lines.length < 2) return [];
      const headers = parseCSVRow(lines[0]);
      return lines.slice(1).map(line => {
        const vals = parseCSVRow(line);
        const obj = {};
        headers.forEach((h, i) => { obj[h] = vals[i] || ''; });
        return obj;
      });
    }

    function parseLocalDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatEventDate(str) {
      return parseLocalDate(str).toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    function guestLabel(n) {
      const g = parseInt(n, 10) || 0;
      return g === 0 ? 'solo' : `+${g} guest${g > 1 ? 's' : ''}`;
    }

    function countAttendees(rsvps) {
      return rsvps.reduce((sum, r) => sum + 1 + (parseInt(r.GuestCount, 10) || 0), 0);
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderAttendeeTable(rsvps) {
      if (!rsvps.length) return `<p class="no-rsvps">No RSVPs were recorded for this event.</p>`;
      const rows = rsvps.map((r, i) => {
        const isAnon = !r.Name || r.Name.toLowerCase() === 'anonymous';
        const nameCell = isAnon ? `<td class="td-name anon">Anonymous</td>` : `<td class="td-name">${esc(r.Name)}</td>`;
        return `<tr><td class="td-num">${i+1}</td>${nameCell}<td class="td-guests">${guestLabel(r.GuestCount)}</td></tr>`;
      }).join('');
      return `<table>
        <thead><tr><th class="td-num">#</th><th>Name</th><th>Guests</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    function renderEvent(event, rsvps) {
      const total = countAttendees(rsvps);
      const attending = total === 0 ? '' : `<span class="attendee-count">${total} attended</span>`;
      const mapsHref = event.MapsURL || `https://maps.google.com/?q=${encodeURIComponent(event.Location + ', Ithaca, NY')}`;
      const notesHtml = event.Notes ? `<p class="event-notes">${esc(event.Notes)}</p>` : '';

      return `
      <div class="event-block">
        <div class="event-card">
          <div class="event-date">${formatEventDate(event.Date)}</div>
          <div class="event-meta">
            <span class="label">Time</span>
            <span class="value">${esc(event.Time)}</span>
            <span class="label">Location</span>
            <span class="value">
              <a href="${esc(mapsHref)}" target="_blank" rel="noopener">${esc(event.Location)}</a>
              &nbsp;&middot; Ithaca, NY
            </span>
          </div>
          ${notesHtml}
        </div>
        <div class="rsvp-section">
          <div class="rsvp-header">
            <h3>Who Came</h3>
            ${attending}
          </div>
          ${renderAttendeeTable(rsvps)}
        </div>
      </div>`;
    }

    async function loadEvents() {
      const container = document.getElementById('events-container');
      try {
        const [eventsText, rsvpsText] = await Promise.all([
          fetch(CONFIG.EVENTS_CSV_URL).then(r => r.text()),
          fetch(CONFIG.RSVPS_CSV_URL).then(r => r.text()),
        ]);

        const events = parseCSV(eventsText);
        const rsvps  = parseCSV(rsvpsText);

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const past = events
          .filter(e => e.Date && parseLocalDate(e.Date) < today)
          .sort((a, b) => parseLocalDate(b.Date) - parseLocalDate(a.Date));

        const rsvpMap = {};
        rsvps.forEach(r => {
          if (!r.EventID) return;
          if (!rsvpMap[r.EventID]) rsvpMap[r.EventID] = [];
          rsvpMap[r.EventID].push(r);
        });

        if (past.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <div class="empty-state-icon">○</div>
            <div class="empty-state-heading">No past events on record yet.</div>
            <p class="empty-state-body">
              The Ithaca group has been meeting for years, but this website is new —
              so there's nothing in the archive just yet. Past events will appear here as they happen.
              <br><br><a href="/ithaca">See upcoming Ithaca events &rarr;</a>
            </p>
          </div>`;
          return;
        }

        container.innerHTML = past
          .map(ev => renderEvent(ev, rsvpMap[ev.EventID] || []))
          .join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="empty-state">
          <div class="empty-state-icon">?</div>
          <div class="empty-state-heading">Couldn't load past events.</div>
          <p class="empty-state-body">Try refreshing in a moment.</p>
        </div>`;
      }
    }

    loadEvents();

  </script>

</body>
</html>
